name: Noticias y cartelera (cada mañana)

on:
  schedule:
    - cron: "0 10 * * *"   # todos los días, 07:00 en Chile (horario de verano; 06:00 en invierno)
  workflow_dispatch:        # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Noticias del mundo
        run: python scripts/noticias.py
      - name: Cartelera (Teatro Municipal y Puntoticket)
        run: python scripts/eventos.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json eventos.json
          git diff --staged --quiet || (git commit -m "Noticias y cartelera $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
