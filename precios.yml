name: Precios de supermercados (cada lunes)

on:
  schedule:
    - cron: "30 9 * * 1"   # lunes, 06:30 en Chile (horario de verano; 05:30 en invierno)
  workflow_dispatch:        # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Extraer precios (Jumbo, Lider, Santa Isabel, Unimarc, Tottus)
        run: python scripts/precios.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          git diff --staged --quiet || (git commit -m "Precios del $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
